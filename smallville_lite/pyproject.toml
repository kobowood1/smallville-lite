[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallville-lite"
version = "0.1.0"
description = "A text-only reimplementation of Generative Agents (Park et al., UIST 2023) on the Claude API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
voyage = ["voyageai>=0.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
smallville = "smallville_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smallville_lite = ["llm/prompts/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real paid API; skipped unless SMALLVILLE_LIVE_TESTS=1 and the API key is set",
]
